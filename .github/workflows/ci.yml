name: ESC-50 research correctness (CPU, no dataset download)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU research package
        run: python -m pip install -e '.[dev,baseline,report]'
      - name: Verify Phase 5 adapter catalog (no data access)
        run: python scripts/research_platform.py catalog > /dev/null
      - name: Run all non-runner tests (synthetic, no real test access)
        run: python -m pytest -q tests --ignore=tests/test_runner.py
      - name: Run subprocess runner tests separately
        run: python -m pytest -q tests/test_runner.py
