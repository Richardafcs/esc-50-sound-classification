[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esc50-sound"
version = "0.1.0"
description = "Reproducible ESC-50 environmental sound classification research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5,<3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipython>=8", "nbformat>=5.10"]
baseline = ["scikit-learn>=1.4,<2"]
report = ["matplotlib>=3.9", "reportlab>=4.2,<5", "Pillow>=10", "pypdf>=5"]
transfer = ["torchlibrosa==0.1.0", "librosa==0.11.0", "scikit-learn==1.6.1", "joblib>=1.4,<2"]

[project.scripts]
esc50 = "esc50_sound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
